name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          # Must match the "packageManager" field in package.json, or the
          # lockfile is rejected by --frozen-lockfile.
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check

      # Build both modes. src/lib/env.ts throws at module load on invalid
      # config, so the dummy values are required; building only one mode
      # would leave the gated routing unverified until launch day.
      - run: pnpm build
        env:
          SITE_MODE: live
          RESEND_API_KEY: dummy_key_for_build
          CONTACT_TO_EMAIL: build@example.com
          CONTACT_FROM_EMAIL: build@example.com
          NEXT_PUBLIC_SITE_URL: https://example.com

      - run: pnpm build
        env:
          SITE_MODE: coming-soon
          RESEND_API_KEY: dummy_key_for_build
          CONTACT_TO_EMAIL: build@example.com
          CONTACT_FROM_EMAIL: build@example.com
          NEXT_PUBLIC_SITE_URL: https://example.com
