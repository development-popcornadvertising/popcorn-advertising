name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    # Dummy values, shared by every step. src/lib/env.ts validates the
    # server-side config at module load and next.config.ts asserts
    # NEXT_PUBLIC_SITE_URL at build time, so a build cannot run without them.
    env:
      RESEND_API_KEY: dummy_key_for_build
      CONTACT_TO_EMAIL: build@example.com
      CONTACT_FROM_EMAIL: build@example.com
      NEXT_PUBLIC_SITE_URL: https://example.com

    steps:
      - uses: actions/checkout@v4

      # No `version:` here on purpose. pnpm/action-setup reads the
      # "packageManager" field from package.json, and specifying the version
      # in both places is a hard error ("Multiple versions of pnpm
      # specified"), not a redundancy. package.json stays the single source
      # of truth, so bumping pnpm is a one-line change.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The same command developers run locally: typecheck, lint,
      # format:check, check:copy, build. Running `verify` rather than
      # listing its parts means the two can never drift apart.
      - name: Verify (live mode)
        run: pnpm verify
        env:
          SITE_MODE: live

      # Build the gated configuration too. Only one mode gets exercised by
      # the step above, which would leave the launch redirects unverified
      # until the day they matter.
      - name: Build (coming-soon mode)
        run: pnpm build
        env:
          SITE_MODE: coming-soon
